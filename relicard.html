<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8E1C3C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ReliCard">
<meta name="app-version" content="1.0 (2026-08-30)">
<title>ReliCard &middot; Reliance Creation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ReliCard - web build of the Android app.
   Tokens mirror app/src/main/res/values/colors.xml + styles.xml.
   Android "serif" -> Noto Serif, "sans-serif" -> Roboto.
   ============================================================ */
:root{
  color-scheme: light;
  --brand:#8E1C3C;
  --brand-dark:#6B1430;
  --gold:#C2903F;
  --gold-soft:#EADAB8;
  --surface:#FFFDFA;
  --background:#F7F0EA;
  --on-surface:#2B1B1E;
  --on-variant:#7A6A66;
  --outline:#E9DAD2;
  --accent-red:#C0392B;
  --scrim:rgba(0,0,0,.6);
  --serif:'Noto Serif', Georgia, 'Times New Roman', serif;
  --sans:'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--sans);
  color:var(--on-surface);
  background:#E4D8D0;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
input{font:inherit}

#app{
  max-width:480px;height:100%;margin:0 auto;
  background:var(--background);
  box-shadow:0 0 0 1px rgba(43,27,30,.06), 0 24px 60px -24px rgba(43,27,30,.35);
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}
#screen{flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- shared: Material outlined card ---------- */
.mcard{
  background:var(--surface);
  border:1px solid var(--outline);
  border-radius:16px;
  overflow:hidden;
}

/* ---------- shared: surface header ---------- */
.header{
  background:var(--surface);
  padding:18px 20px 14px;
  display:flex;align-items:flex-start;gap:12px;
  flex:none;
}
.header .back{
  width:32px;height:32px;flex:none;border-radius:50%;margin-top:2px;
  display:grid;place-items:center;
  border:1px solid var(--outline);color:var(--brand);
  font-size:15px;line-height:1;
}
.header .back:active{background:var(--background)}
.header h1{
  margin:0;font-family:var(--serif);font-weight:700;
  font-size:24px;line-height:1.15;color:var(--brand);
}
.header .rule{width:44px;height:1px;background:var(--gold);margin:6px 0 5px}
.header .eyebrow{
  margin:0;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--on-variant);
}
.divider{height:1px;background:var(--outline);flex:none}

/* ---------- Material buttons ---------- */
.mbtn{
  padding:12px 16px;border-radius:4px;
  font-family:var(--sans);font-size:14px;font-weight:500;
  letter-spacing:.09em;text-transform:uppercase;
  transition:background .15s ease;
}
.mbtn.filled{background:var(--brand);color:#fff}
.mbtn.filled:active{background:var(--brand-dark)}
.mbtn.outlined{border:1px solid var(--outline);color:var(--brand)}
.mbtn.outlined:active{background:var(--background)}
.mbtn.pill{border-radius:22px}
.mbtn.compact{padding:12px 15px;border-radius:28px;flex:none;white-space:nowrap}
.mbtn .ic{
  width:17px;height:17px;stroke:currentColor;fill:none;
  vertical-align:-3px;margin-right:8px;
}
.btnrow{display:flex;gap:12px;padding:10px 16px 0;flex:none}
.btnrow .mbtn{flex:1}
.shortcutrow{padding-top:8px}

/* ---------- home ---------- */
.home{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.masthead{
  background:var(--surface);flex:none;
  padding:16px 20px 12px;text-align:center;
}
.masthead .lockup{
  display:flex;align-items:center;justify-content:center;gap:11px;
  cursor:pointer;
}
.masthead .logo{height:34px;width:auto;display:block;flex:none}
.masthead .name{
  font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.15;
  letter-spacing:.13em;text-transform:uppercase;color:var(--brand);
  display:inline-block;
}
.masthead .rule{width:56px;height:1px;background:var(--gold);margin:6px auto 5px}
.masthead .tagline{
  margin:0;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--on-variant);
}
.searchpill{
  display:flex;align-items:center;gap:12px;flex:none;
  margin:12px 16px 0;padding:11px 16px;
  background:var(--surface);border:1px solid var(--outline);border-radius:24px;
  color:var(--on-variant);font-size:14px;text-align:left;width:calc(100% - 32px);
}
.searchpill svg{width:19px;height:19px;flex:none;stroke:var(--on-variant)}

.tilegrid{
  flex:1;min-height:430px;display:flex;flex-direction:column;
  padding:12px 11px 4px;
}
.tilerow{display:flex;flex:1;margin-bottom:10px;min-height:0}
.tilerow.big{flex:1.4}
.tilerow:last-child{margin-bottom:0}

.tile{
  flex:1;margin:0 5px;position:relative;overflow:hidden;
  border:1px solid var(--outline);border-radius:16px;
  background:linear-gradient(315deg,#A93453,#8E1C3C 50%,#6B1430);
  display:block;text-align:left;min-width:0;
  transition:transform .12s ease;
}
.tile:active{transform:scale(.985)}
.tile img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
}
.tile .scrim{
  position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.55) 35%,rgba(0,0,0,0) 100%);
}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:0 14px 12px}
.tile .cap .label{
  display:block;font-family:var(--serif);font-weight:700;font-size:17px;
  line-height:1.15;letter-spacing:.04em;color:#fff;
}
.tilerow.big .cap .label{font-size:22px}
.tile .cap .count{
  display:block;margin-top:1px;font-size:12px;color:#fff;opacity:.85;
}

.homefoot{display:flex;flex:none;padding:8px 0 6px}
.version{
  margin:0;flex:none;padding:0 0 10px;text-align:center;
  font-size:10px;letter-spacing:.08em;color:var(--on-variant);opacity:.65;
}
.homefoot button{
  flex:1;text-align:center;font-size:11px;color:var(--on-variant);
  text-decoration:underline;text-underline-offset:3px;padding:4px 2px;
}

/* ---------- list ---------- */
.listwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.listhead{background:var(--surface);padding:14px 16px 12px;flex:none}
.listhead.row{display:flex;gap:10px;align-items:center}
.listhead.row .searchbox{flex:1;min-width:0}
.searchbox{position:relative}
.searchbox input{
  width:100%;padding:14px 16px 14px 46px;
  border:1px solid var(--outline);border-radius:28px;
  background:var(--surface);font-size:14px;color:var(--on-surface);
}
.searchbox input::placeholder{color:var(--on-variant)}
.searchbox input:focus{outline:none;border-color:var(--brand);border-width:2px;padding:13px 15px 13px 45px}
.searchbox svg{
  position:absolute;left:17px;top:50%;transform:translateY(-50%);
  width:19px;height:19px;stroke:var(--on-variant);pointer-events:none;
}
.rows{flex:1;overflow-y:auto;padding:15px 12px calc(15px + env(safe-area-inset-bottom))}
.row{
  display:block;width:100%;margin-bottom:15px;position:relative;
  border:1px solid var(--outline);border-radius:16px;background:var(--surface);
  overflow:hidden;transition:transform .12s ease;
}
.row:active{transform:scale(.99)}
.row .shot{display:block;position:relative;height:250px;background:var(--background)}
.row .shot img{width:100%;height:100%;object-fit:cover;display:block}
.row .bar{
  position:absolute;left:0;right:0;bottom:0;
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;background:#FBE4E1;border-top:1.5px solid var(--accent-red);
}
.row .no{flex:1;font-family:var(--serif);font-weight:700;font-size:15px;color:var(--accent-red)}
.row .price{font-family:var(--serif);font-weight:800;font-size:15px;color:var(--accent-red);text-align:right}

.empty{padding:56px 24px;text-align:center;color:var(--on-variant)}
.empty p{margin:0 0 18px;font-size:14px;line-height:1.7}

/* ---------- detail ---------- */
.detail{flex:1;display:flex;flex-direction:column;min-height:0}
.gallery{flex:1;position:relative;background:var(--surface);min-height:0}
.carousel{
  height:100%;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.carousel::-webkit-scrollbar{display:none}
.carousel figure{flex:0 0 100%;scroll-snap-align:center;margin:0;height:100%}
.carousel img{width:100%;height:100%;object-fit:contain;display:block}
.dots{
  position:absolute;left:0;right:0;bottom:12px;
  display:flex;justify-content:center;gap:4px;pointer-events:none;
}
.dots i{
  width:10px;height:10px;border-radius:5px;
  border:2px solid var(--brand);transition:background .2s ease;
}
.dots i.on{background:var(--brand)}

.sheet{
  flex:none;background:var(--surface);border-top:2px solid var(--gold);
  padding:14px 0 calc(14px + env(safe-area-inset-bottom));
}
.sheet .headrow{
  display:flex;align-items:center;gap:12px;
  margin:0 20px;padding:14px 18px;
  background:#FBE4E1;border:1.5px solid var(--accent-red);border-radius:12px;
}
.sheet .itemno{
  flex:1;font-family:var(--serif);font-weight:700;font-size:27px;color:var(--accent-red);
}
.sheet .itemprice{
  font-family:var(--serif);font-weight:800;font-size:27px;color:var(--accent-red);text-align:right;
}
.sheet .avail{margin:8px 0 0;padding:0 20px;font-size:13px;color:var(--on-variant)}
.sheet .extra{margin:6px 0 0;padding:0 20px;font-size:13px;line-height:1.5;color:var(--accent-red)}
.sheet .btnrow{padding-top:14px}

/* ---------- price list ---------- */
.pricewrap{flex:1;display:flex;flex-direction:column;min-height:0}
.pricebody{flex:1;overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
.pnote{margin:0 0 14px;font-size:12px;line-height:1.6;color:var(--on-variant)}
.ptable{
  margin:0 0 16px;background:var(--surface);
  border:1px solid var(--outline);border-radius:16px;overflow:hidden;
}
.ptable h2{
  margin:0;padding:11px 16px;background:var(--background);
  font-family:var(--serif);font-weight:700;font-size:13px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--brand);
}
.ptable.flag h2{background:var(--gold-soft);color:var(--brand-dark)}
/* Hairlines come from the cells themselves, pulled left by a pixel so the
   column rule is shared - a gap-and-background grid would paint the outline
   colour into the empty tracks a short last row leaves behind. */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pgrid.wide{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.pcell{
  display:flex;align-items:baseline;gap:8px;width:100%;
  padding:10px 14px;text-align:left;background:var(--surface);
  border-top:1px solid var(--outline);border-left:1px solid var(--outline);
  margin-left:-1px;
}
.pcell .pno{flex:1;font-family:var(--serif);font-weight:700;font-size:14px;color:var(--on-surface)}
.pcell .sub{
  display:block;margin-top:1px;font-family:var(--sans);font-weight:400;
  font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--on-variant);
}
.pcell .prate{
  font-family:var(--serif);font-weight:800;font-size:14px;
  color:var(--accent-red);white-space:nowrap;
}
.pcell.link .pno{
  color:var(--brand);text-decoration:underline;
  text-decoration-color:var(--gold);text-underline-offset:3px;
}
.pcell.link:active{background:var(--background)}
.pfoot{margin:2px 0 0;font-size:12px;line-height:1.75;color:var(--on-variant)}

/* ---------- prose screens ---------- */
.scroll{flex:1;overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.textcard{padding:18px;font-size:14px;line-height:1.65;color:var(--on-variant)}
.textcard p{margin:0 0 14px}
.textcard p:last-child{margin:0}
.orderline{
  margin:18px 0 0;text-align:center;font-weight:500;font-size:15px;color:var(--accent-red);
}
.orderline.strike{margin-top:2px;font-weight:400;text-decoration:line-through}
.maplink{
  display:block;margin:16px 0 0;padding:13px;text-align:center;
  background:var(--brand);color:#fff;border-radius:4px;text-decoration:none;
  font-size:14px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;
}

/* ---------- login ---------- */
.login{
  flex:1;overflow-y:auto;background:var(--surface);
  display:flex;flex-direction:column;justify-content:center;
  padding:32px 24px calc(32px + env(safe-area-inset-bottom));
}
.loginbox{width:100%;max-width:330px;margin:0 auto}
.loginbox .brandmark{text-align:center;margin-bottom:30px}
.loginbox .brandmark .logo{height:74px;width:auto;display:block;margin:0 auto 14px}
.loginbox .brandmark .name{
  font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.2;
  letter-spacing:.15em;text-transform:uppercase;color:var(--brand);display:inline-block;
}
.loginbox .brandmark .rule{width:56px;height:1px;background:var(--gold);margin:7px auto 6px}
.loginbox .brandmark .tagline{
  margin:0;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-variant);
}
.login h1{
  margin:0;font-family:var(--serif);font-weight:700;font-size:26px;
  color:var(--brand);text-align:center;
}
.login .sub{margin:6px 0 0;font-size:14px;color:var(--on-variant);text-align:center}
.login form{margin:24px 0 0;display:flex;flex-direction:column;gap:16px}
.tfield{position:relative}
.tfield input{
  width:100%;padding:16px 16px 15px;
  border:1px solid var(--outline);border-radius:4px;
  background:var(--surface);font-size:16px;color:var(--on-surface);
}
.tfield input:focus{outline:none;border:2px solid var(--brand);padding:15px 15px 14px}
.tfield label{
  position:absolute;left:12px;top:-7px;padding:0 5px;
  background:var(--surface);font-size:11px;color:var(--on-variant);
}
.tfield input:focus + label{color:var(--brand)}
.login .err{min-height:18px;margin:0;font-size:13px;color:var(--accent-red);text-align:center}
.login .mbtn{margin-top:4px;padding:15px}

/* ---------- splash ---------- */
.splash{flex:1;display:grid;place-items:center;background:var(--surface);text-align:center;padding:40px}
.splash .logo{height:96px;width:auto;display:block;margin:0 auto 18px}
.splash.syncing .logo{animation:breathe 1.9s ease-in-out infinite}
@keyframes breathe{
  0%,100%{opacity:.55;transform:scale(.97)}
  50%{opacity:1;transform:scale(1)}
}
.splash .name{
  font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.2;
  letter-spacing:.15em;text-transform:uppercase;color:var(--brand);
}
.splash .rule{width:56px;height:1px;background:var(--gold);margin:10px auto}
.splash p{margin:0;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-variant)}

/* ---------- dialog + toast ---------- */
.scrim-bg{
  position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.5);
  display:grid;place-items:center;padding:26px;animation:fade .16s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dialog{
  width:100%;max-width:340px;background:var(--surface);border-radius:16px;
  padding:22px 22px 14px;animation:rise .2s cubic-bezier(.2,.7,.3,1);
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.dialog h3{margin:0 0 10px;font-family:var(--serif);font-weight:700;font-size:20px;color:var(--brand)}
.dialog p{margin:0;font-size:14px;line-height:1.65;color:var(--on-variant);white-space:pre-line}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dialog .acts button{
  padding:10px 14px;border-radius:4px;font-size:14px;font-weight:500;
  letter-spacing:.09em;text-transform:uppercase;color:var(--brand);
}
.dialog .acts button:active{background:var(--background)}

/* ---------- add-to-home-screen prompt ---------- */
.installsheet{
  position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  z-index:50;background:var(--surface);
  border:1px solid var(--outline);border-radius:16px;
  padding:16px 16px 10px;
  box-shadow:0 16px 44px -12px rgba(43,27,30,.5);
  animation:rise .24s cubic-bezier(.2,.7,.3,1);
}
.installsheet .row1{display:flex;align-items:center;gap:12px}
.installsheet .mark{width:44px;height:auto;flex:none;display:block}
.installsheet h4{margin:0;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--brand)}
.installsheet p{margin:10px 0 0;font-size:13px;line-height:1.55;color:var(--on-variant)}
.installsheet .acts{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
.installsheet .acts button{
  padding:10px 14px;border-radius:4px;font-size:13px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;color:var(--brand);
}
.installsheet .acts button:active{background:var(--background)}
.installsheet .acts .solid{background:var(--brand);color:#fff}

#toast{
  position:absolute;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));
  z-index:60;padding:14px 16px;border-radius:4px;
  background:#322427;color:#FFF6F2;font-size:14px;line-height:1.45;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.6);animation:rise .2s cubic-bezier(.2,.7,.3,1);
}

:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
/* A phone switched to "Desktop site" ignores the viewport meta and reports a
   ~980px viewport, which left the app as a narrow column adrift in the middle.
   Any touch screen gets the full width instead. */
@media (pointer: coarse){
  #app{max-width:none;box-shadow:none}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>

<body>
<div id="app"><div id="screen"></div></div>

<script>
(function(){
"use strict";

/* ============================================================
   1. Sources - identical to SplashScreen.java
   ============================================================ */
/* Dropbox's www.dropbox.com/...?raw=1 links 302 twice, and neither redirect
   carries Access-Control-Allow-Origin, so fetch() fails the CORS check in every
   browser - which breaks both the catalogue sync and attaching a photo to a
   WhatsApp share. dl.dropboxusercontent.com serves the same bytes in a single
   200 with ACAO: *. Same Dropbox files, so edits still show up here. */
function dropboxDirect(u){
  u = String(u || "").trim();
  if(!/(^|\.)dropbox\.com\//i.test(u)) return u;
  try{
    var url = new URL(u);
    url.hostname = "dl.dropboxusercontent.com";
    url.searchParams.delete("raw");
    url.searchParams.delete("dl");
    url.hash = "";
    return url.toString();
  }catch(e){ return u; }
}

var CATALOGUE_URL = dropboxDirect("https://www.dropbox.com/s/e1ktn3oybeap0ww/document.json?raw=1");

'stroke-linecap="round" stroke-linejoin="round">' +
'<path d="M12.6 3H21v8.4l-9.3 9.3a1.5 1.5 0 0 1-2.1 0l-6.3-6.3a1.5 1.5 0 0 1 0-2.1Z"/>' +
'<circle cx="17.2" cy="6.8" r="1.3"/></svg>';

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function store(key, val){
  try{
    if(val === undefined){
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }
    localStorage.setItem(key, JSON.stringify(val));
    return true;
  }catch(e){ return val === undefined ? null : false; }
}
function digits(s){ return String(s || "").replace(/\D/g, ""); }
function designCount(n){ return n === 0 ? "No designs yet" : n + (n === 1 ? " design" : " designs"); }

function toast(msg){
  var old = document.getElementById("toast");
  if(old) old.remove();
  var el = document.createElement("div");
  el.id = "toast"; el.setAttribute("role","status"); el.textContent = msg;
  $app.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.remove(); }, 3600);
}

function dialog(opts){
  var scrim = document.createElement("div");
  scrim.className = "scrim-bg";
  var acts = (opts.actions || [{label:"OK"}]).map(function(a, i){
    return '<button data-act="' + i + '">' + esc(a.label) + "</button>";
  }).join("");
  scrim.innerHTML =
    '<div class="dialog" role="dialog" aria-modal="true">' +
      (opts.title ? "<h3>" + esc(opts.title) + "</h3>" : "") +
      "<p>" + esc(opts.body || "") + "</p>" +
      '<div class="acts">' + acts + "</div>" +
    "</div>";
  scrim.addEventListener("click", function(e){
    var btn = e.target.closest("[data-act]");
    if(btn){
      var a = (opts.actions || [{}])[+btn.dataset.act];
      scrim.remove();
      if(a && a.run) a.run();
      return;
    }
    if(e.target === scrim) scrim.remove();
  });
  $app.appendChild(scrim);
  var first = scrim.querySelector("[data-act]");
  if(first) first.focus();
}

/* Opening an external app must survive popup blockers, so use a real link. */
function openExternal(url){
  var a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
}
function call(number){ location.href = "tel:" + number; }

/* wa.me WITH a number opens that chat; WITHOUT one opens WhatsApp's
   contact picker - the web equivalent of the app's share chooser. */
function whatsapp(number, text){
  openExternal("https://wa.me/" + (number ? digits(number) : "") +
               (text ? "?text=" + encodeURIComponent(text) : ""));
}

/* wa.me is a verified app link, so Android/iOS route it straight to whichever
   WhatsApp variant is registered as the default handler - no chooser, which
   is why WhatsApp Business never showed up. navigator.share with no files
   still opens the OS's generic share sheet (ACTION_SEND on Android), which
   lists every share target - including WhatsApp Business - as its own entry.
   Only reach for wa.me when Web Share isn't available at all (desktop
   browsers), where "which app" doesn't apply anyway. */
function shareText(text){
  if(navigator.share){
    navigator.share({text: text}).catch(function(err){
      if(err && err.name === "AbortError") return;
      whatsapp(null, text);
    });
    return;
  }
  whatsapp(null, text);
}

/* ============================================================
   3. Catalogue - mirrors DataDao + CoverBinder
   ============================================================ */
function normalise(raw){
  return (raw.Weddingcard || []).map(function(c){
    return {
      number: String(c.number == null ? "" : c.number).trim(),
      type: String(c.type || "").trim(),
      price: String(c.price || "").trim(),
      stock: String(c.stock || "").trim(),
      extrainfo: String(c.extrainfo || "").trim(),
      extrainner: String(c.extrainnerrate || "").trim(),
      /* Rewritten so the share sheet can fetch the photo, not just display it. */
      images: (c.allimages || []).map(dropboxDirect).filter(Boolean)
    };
  }).filter(function(c){ return c.number !== ""; });
}

function byType(t){ return cards.filter(function(c){ return c.type === t; }); }
/* Card codes are free-form strings, so compare them loosely: case-insensitive
   and ignoring punctuation, so "sb1" finds "S.B-1". */
function numKey(v){ return String(v == null ? "" : v).toLowerCase().replace(/[^a-z0-9]/g, ""); }

function byNumber(n){
  var want = numKey(n);
  if(!want) return null;
  return cards.filter(function(c){ return numKey(c.number) === want; })[0] || null;
}

/* Digits sort numerically (3 before 101), lettered codes fall in after. */
function compareNumbers(a, b){
  return String(a.number).localeCompare(String(b.number), undefined,
                                        {numeric:true, sensitivity:"base"});
}

/* CoverBinder.bind: first synced image across the given types, plus a live count. */
function cover(){
  var types = Array.prototype.slice.call(arguments);
  var total = 0, url = null;
  types.forEach(function(t){
    var list = byType(t);
    total += list.length;
    if(!url){
      for(var i = 0; i < list.length; i++){
        if(list[i].images.length){ url = list[i].images[0]; break; }
      }
    }
  });
  return {url:url, count:total};
}

function loadCatalogue(){
  return fetch(CATALOGUE_URL, {cache:"no-cache"})
    .then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(json){
      var list = normalise(json);
      if(!list.length) throw new Error("empty catalogue");
      store(STORE_CACHE, list);
      live = true;
      return list;
    })
    .catch(function(){
      live = false;
      return store(STORE_CACHE);   /* null when nothing was ever synced */
    });
}

/* ActivityTab.whatsAppButton: photo + order slip, sent to whichever customer
   the dealer picks.

   Web Share must be invoked inside the tap that triggered it - awaiting a fetch
   first spends the user activation and iOS Safari then refuses with
   NotAllowedError. So the photo is fetched the moment the card opens and held
   ready, and the tap shares it synchronously.

   The download's outcome is read synchronously off `photoState.status` at tap
   time rather than off a `.then()` callback - a `.then()` on an already-settled
   promise still runs as a microtask, and some browsers no longer count that as
   "inside the tap", so calling navigator.share from it silently drops back to
   text-only. Checking the plain object field instead means a tap that lands
   after the download finished still shares the photo. A tap that lands before
   it finishes just asks the dealer to tap again a moment later, rather than
   risk a share call losing the gesture. */
var photoState = null;   /* {number, status:"loading"|"ready"|"failed", file} */
var sharing = false;     /* guards against a double-tap firing two share sheets */

function photoType(url){
  var ext = (url.split("?")[0].match(/\.(jpe?g|png|webp|gif)$/i) || [])[1] || "jpg";
  ext = ext.toLowerCase();
  /* Dropbox labels these downloads application/json even though the bytes are a
     JPEG, and WhatsApp drops a file whose type is not an image - so set the type
     from the file name and ignore what the server claims. */
  return {ext: ext, mime: "image/" + ({jpg:"jpeg", jpeg:"jpeg"}[ext] || ext)};
}

/* Some in-app browsers (a link opened inside WhatsApp, Instagram, Facebook)
   expose navigator.share but refuse files. Probe with a real File. */
function canSharePhotos(){
  if(!window.isSecureContext || !navigator.share || !navigator.canShare) return false;
  try{
    return navigator.canShare({
      files: [new File([new Uint8Array(1)], "probe.jpg", {type:"image/jpeg"})]
    });
  }catch(e){ return false; }
}

/* Why the photo cannot be attached, in words a dealer can act on. */
function shareBlocker(img){
  if(!img) return "This design has no photo yet.";
  if(!window.isSecureContext) return "Attaching the photo needs an https address.";
  if(!navigator.share || !navigator.canShare || !canSharePhotos()){
    return "This browser cannot attach photos. Open the page in Chrome or Safari " +
           "rather than inside another app, then try again.";
  }
  return null;
}

function fetchWithRetry(url, triesLeft){
  return fetch(url, {cache:"no-cache"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.blob(); })
    .catch(function(err){
      /* Dropbox and flaky mobile networks both drop a request now and then -
         one retry clears most of the "photo just never showed up" reports. */
      if(triesLeft > 0) return fetchWithRetry(url, triesLeft - 1);
      throw err;
    });
}

function prefetchPhoto(card){
  var img = card.images[0];
  if(!img || !canSharePhotos()){ photoState = null; return; }

  var t = photoType(img);
  var state = {number: card.number, status: "loading", file: null};
  photoState = state;

  fetchWithRetry(img, 1)
    .then(function(blob){
      var file = new File([blob], "relicard-" + numKey(card.number) + "." + t.ext,
                          {type: t.mime});
      if(!navigator.canShare({files:[file]})) throw new Error("unshareable file");
      state.file = file;
      state.status = "ready";
    })
    .catch(function(){ state.status = "failed"; });
}

function shareCard(card){
  if(sharing) return;
  var single = card.type === T.singleFlat || card.type === T.singlePadding;
  var slip = "No." + card.number + "               Quantity:  " +
             (single ? "\nMode:" : "\n Mode:               Extra Inner:");
  var img = card.images[0] || "";
  var link = slip + (img ? "\n" + img : "");

  function sendFile(file){
    sharing = true;
    navigator.share({files:[file], text:slip}).catch(function(err){
      if(err && err.name === "AbortError") return;      /* dealer closed the sheet */
      /* Some share targets refuse files and text together and drop the photo.
         Offer the photo on its own before giving up on it. */
      return navigator.share({files:[file]}).catch(function(err2){
        if(err2 && err2.name === "AbortError") return;
        shareText(link);
      });
    }).then(function(){ sharing = false; }, function(){ sharing = false; });
  }

  var state = (photoState && photoState.number === card.number) ? photoState : null;

  /* Photo already downloaded: share inside the tap, activation intact. */
  if(state && state.status === "ready"){
    sendFile(state.file);
    return;
  }

  /* Still downloading: ask for another tap rather than share async and risk
     the platform refusing to attach the photo. */
  if(state && state.status === "loading"){
    toast("Preparing the photo — tap Share again in a moment.");
    return;
  }

  var why = shareBlocker(img);
  if(why) toast(why);
  shareText(link);
}

/* The sheet is a single 3.3 MB photo, so it is fetched once and held for the
   rest of the session rather than re-downloaded on every visit to the screen.
   It deliberately does not share photoState: that is one slot, and the next
   card the dealer opens would overwrite it. The activation rule from shareCard
   applies unchanged - the bytes must be in hand before the tap, and the
   outcome is read synchronously off .status rather than from a .then(). */
var priceShot = null;   /* {status:"loading"|"ready"|"failed", file} */

function prefetchPriceList(){
  if(priceShot && priceShot.status !== "failed") return;   /* have it, or on the way */
  if(!canSharePhotos()){ priceShot = null; return; }

  var t = photoType(PRICE_IMAGE);
  var state = {status:"loading", file:null};
  priceShot = state;

  fetchWithRetry(PRICE_IMAGE, 1)
    .then(function(blob){
      var file = new File([blob], "reliance-price-list-" + PRICE_EFFECTIVE + "." + t.ext,
                          {type: t.mime});
      if(!navigator.canShare({files:[file]})) throw new Error("unshareable file");
      state.file = file;
      state.status = "ready";
    })
    .catch(function(){ state.status = "failed"; });
}

function sharePriceList(){
  if(sharing) return;
  var link = PRICE_CAPTION + "\n" + PRICE_IMAGE;

  /* Photo already downloaded: share inside the tap, activation intact. */
  if(priceShot && priceShot.status === "ready"){
    var file = priceShot.file;
    sharing = true;
    navigator.share({files:[file], text: PRICE_CAPTION}).catch(function(err){
      if(err && err.name === "AbortError") return;   /* dealer closed the sheet */
      /* Some share targets refuse files and text together and drop the photo.
         Offer the photo on its own before giving up on it. */
      return navigator.share({files:[file]}).catch(function(err2){
        if(err2 && err2.name === "AbortError") return;
        shareText(link);
      });
    }).then(function(){ sharing = false; }, function(){ sharing = false; });
    return;
  }

  /* Still downloading: ask for another tap rather than share async and risk
     the platform refusing to attach the photo. */
  if(priceShot && priceShot.status === "loading"){
    toast("Preparing the price list \u2014 tap Share again in a moment.");
    return;
  }

  /* Never fetched, or the fetch failed. Send the caption and the image link so
     the customer still gets the sheet, and start the download again so the
     next tap can attach it. */
  var why = shareBlocker(PRICE_IMAGE);
  if(why) toast(why);
  prefetchPriceList();
  shareText(link);
}

          "</div>" +
        "</section>";
    }).join("");

    if(!tables){
      body.innerHTML = '<div class="empty"><p>No card numbered ' + esc(q) +
        ' on this price list.</p><button class="mbtn outlined" data-call="' +
        SHOP_PHONE + '">Call office</button></div>';
      return;
    }

    body.innerHTML =
      '<p class="pnote">' + esc(PRICE_SEASON) + " nett rates, w.e.f. " +
        esc(PRICE_EFFECTIVE) + ". Rates are per 100 cards, blank." +
        (q ? "" : " Numbers shown in maroon open their design.") + "</p>" +
      tables + PRICE_FOOT;
  }

  draw("");
  input.addEventListener("input", function(){ draw(numKey(input.value)); });

  /* Start the download now so the sheet is attachable by the time Share is
     tapped; a second visit reuses what the first one fetched. */
  prefetchPriceList();
  $screen.querySelector("[data-shareprices]")
    .addEventListener("click", sharePriceList);
}

function screenLogin(){
  paint(
    '<div class="login">' +
      '<div class="loginbox">' +
        '<div class="brandmark">' +
          '<img class="logo" src="' + LOGO + '" alt="Reliance Creation">' +
          '<span class="name">Reliance Creation</span>' +
          '<div class="rule"></div>' +
          '<p class="tagline">Wedding &amp; invitation cards · since 1991</p>' +
        "</div>" +
        "<h1>Sign in</h1>" +
        '<p class="sub">Enter the passcode issued by Reliance Creation</p>' +
        '<form id="loginform" novalidate>' +
          '<div class="tfield">' +
            '<input id="f-pass" name="password" type="password" inputmode="numeric" ' +
              'autocomplete="current-password" enterkeyhint="go" placeholder=" ">' +
            '<label for="f-pass">Passcode</label>' +
          "</div>" +
          '<p class="err" id="loginerr" role="alert"></p>' +
          '<button class="mbtn filled" type="submit">Sign in</button>' +
        "</form>" +
        '<div class="btnrow" style="padding:18px 0 0">' +
          '<button class="mbtn outlined" data-call="' + SHOP_PHONE + '">Call office</button>' +
        "</div>" +
        '<p class="version">' + esc(BUILD_LABEL) + "</p>" +
      "</div>" +
    "</div>"
  );

  var form = document.getElementById("loginform");
  var err = document.getElementById("loginerr");
  document.getElementById("f-pass").focus();

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var pass = form.password.value.trim();
    if(pass.toLowerCase() !== PASSCODE){
      err.textContent = "Enter Valid Password";
      form.password.select();
      return;
    }
    var record = {at: Date.now()};
    if(!store(STORE_LOGIN, record)){
      session = record;   /* private browsing refuses storage: this session only */
    }
    boot();
  });
}

/* ============================================================
   5. Routing
   ============================================================ */
function route(){
  var parts = (location.hash || "#/").slice(2).split("/").filter(Boolean);
  if(!parts.length) return screenHome();
  if(parts[0] === "g") return screenGroup(parts[1]);
  if(parts[0] === "c") return screenList(parts[1] || T.allSearch);
  if(parts[0] === "i") return screenDetail(decodeURIComponent(parts[1] || ""));
  if(parts[0] === "prices") return screenPrices();
  if(parts[0] === "terms") return screenTerms();
  if(parts[0] === "about") return screenAbout();
  return screenHome();
}

document.addEventListener("click", function(e){
  var go = e.target.closest("[data-go]");
  if(go){ location.hash = go.dataset.go; return; }

  if(e.target.closest("[data-back]")){
    if(history.length > 1) history.back(); else location.hash = "#/";
    return;
  }
  var c = e.target.closest("[data-call]");
  if(c){ call(c.dataset.call); return; }

  var w = e.target.closest("[data-wa]");
  if(w){ whatsapp(w.dataset.wa, ""); return; }

  if(e.target.closest("[data-dev]")){
    dialog({
      title:"Want to make your Own App?",
      body:DEV_PITCH,
      actions:[
        {label:"Call", run:function(){ call(DEV_PHONE); }},
        {label:"WhatsApp", run:function(){ whatsapp(DEV_WA, ""); }}
      ]
    });
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    var s = document.querySelector(".scrim-bg");
    if(s) s.remove();
  }
  if(e.key === "Enter"){
    var g = e.target.closest && e.target.closest("[data-go]");
    if(g){ location.hash = g.dataset.go; }
  }
});

/* ============================================================
   6. Add to home screen
   ============================================================ */
var STORE_SHORTCUT = "relicard.shortcut";
var deferredInstall = null;

function isStandalone(){
  try{
    return window.matchMedia("(display-mode: standalone)").matches ||
           navigator.standalone === true;
  }catch(e){ return false; }
}

/* The shortcut icon is the real logo on the app's ivory stock with a gold
   keyline, composited here so the page still needs no separate icon files. */
function iconPng(size, logo){
  var c = document.createElement("canvas");
  c.width = c.height = size;
  var g = c.getContext("2d");
  g.fillStyle = "#FFFDFA"; g.fillRect(0, 0, size, size);
  g.strokeStyle = "#C2903F"; g.lineWidth = Math.max(2, size * 0.022);
  g.strokeRect(size * 0.085, size * 0.085, size * 0.83, size * 0.83);

  if(logo && logo.width){
    var box = size * 0.66;
    var k = Math.min(box / logo.width, box / logo.height);
    var w = logo.width * k, h = logo.height * k;
    g.drawImage(logo, (size - w) / 2, (size - h) / 2, w, h);
  }else{
    g.fillStyle = "#8E1C3C";
    g.font = "700 " + Math.round(size * 0.46) + "px Georgia, 'Times New Roman', serif";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText("R", size / 2, size * 0.55);
  }
  return c.toDataURL("image/png");
}

function addManifest(){
  var img = new Image();
  img.onload = function(){ buildManifest(img); };
  img.onerror = function(){ buildManifest(null); };
  img.src = LOGO;
}

function buildManifest(logo){
  try{
    var i192 = iconPng(192, logo), i512 = iconPng(512, logo);

    var apple = document.createElement("link");
    apple.rel = "apple-touch-icon"; apple.href = i192;
    document.head.appendChild(apple);

    var manifest = {
      name: "ReliCard · Reliance Creation",
      short_name: "ReliCard",
      start_url: location.href.split("#")[0],
      display: "standalone",
      background_color: "#FFFDFA",
      theme_color: "#8E1C3C",
      icons: [
        {src:i192, sizes:"192x192", type:"image/png"},
        {src:i512, sizes:"512x512", type:"image/png", purpose:"any maskable"}
      ]
    };
    var link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)],
                                    {type:"application/manifest+json"}));
    document.head.appendChild(link);
  }catch(e){ /* the manual instructions still work */ }
}

window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstall = e;
  offerShortcut();
});
window.addEventListener("appinstalled", function(){
  store(STORE_SHORTCUT, "installed");
  var s = document.querySelector(".installsheet");
  if(s) s.remove();
  var row = document.querySelector(".shortcutrow");
  if(row) row.remove();
});

/* force = the buyer tapped "Add to Home Screen", so show it even if the
   one-time prompt was dismissed earlier and whatever the platform supports. */
function offerShortcut(force){
  if(isStandalone()) return;
  if(!force && store(STORE_SHORTCUT)) return;
  if(document.querySelector(".installsheet")) return;
  if(!force && !document.querySelector(".home")) return;   /* auto-prompt: home only */

  var ua = navigator.userAgent;
  var ios = /iphone|ipad|ipod/i.test(ua);
  var android = /android/i.test(ua);
  var body, acts;

  if(deferredInstall){
    body = "Add ReliCard to your home screen — it opens straight to the catalogue, like an app.";
    acts = '<button data-shortcut="later">Not now</button>' +
           '<button class="solid" data-shortcut="add">Add</button>';
  }else if(ios){
    body = "Tap the Share button in Safari, then choose “Add to Home Screen”. " +
           "ReliCard will then open like an app.";
    acts = '<button class="solid" data-shortcut="later">Got it</button>';
  }else if(android){
    body = "Open the browser menu and choose “Add to Home screen”. " +
           "ReliCard will then open like an app.";
    acts = '<button class="solid" data-shortcut="later">Got it</button>';
  }else if(force){
    body = "Open your browser menu and choose “Install ReliCard”, or “Create shortcut”, " +
           "to keep the catalogue one click away.";
    acts = '<button class="solid" data-shortcut="later">Got it</button>';
  }else{
    return;   /* desktop, unprompted: nothing useful to say */
  }

  var el = document.createElement("div");
  el.className = "installsheet";
  el.innerHTML =
    '<div class="row1"><img class="mark" src="' + LOGO + '" alt="">' +
      "<h4>Keep ReliCard one tap away</h4></div>" +
    "<p>" + body + "</p>" +
    '<div class="acts">' + acts + "</div>";
  $app.appendChild(el);
}

document.addEventListener("click", function(e){
  var b = e.target.closest("[data-shortcut]");
  if(!b) return;
  var sheet = b.closest(".installsheet");

  if(b.dataset.shortcut === "offer"){
    offerShortcut(true);
    return;
  }

  if(b.dataset.shortcut === "add" && deferredInstall){
    var ev = deferredInstall;
    deferredInstall = null;
    if(sheet) sheet.remove();
    ev.prompt();
    ev.userChoice.then(function(choice){
      store(STORE_SHORTCUT, choice && choice.outcome === "accepted" ? "installed" : "dismissed");
    });
    return;
  }
  store(STORE_SHORTCUT, "dismissed");
  if(sheet) sheet.remove();
});

/* ============================================================
   7. Boot
   ============================================================ */
var session = null;

function boot(){
  if(!session && !store(STORE_LOGIN)) return screenLogin();
  screenSplash();
  loadCatalogue().then(function(list){
    if(!list || !list.length) return screenNoCatalogue();
    cards = list;
    window.removeEventListener("hashchange", route);
    window.addEventListener("hashchange", route);
    route();
    if(!live){
      toast("Showing the last synced catalogue — could not reach the live one.");
    }
    setTimeout(function(){ offerShortcut(false); }, 1800);   /* after the first paint settles */
  });
}

addManifest();
boot();
})();
</script>
